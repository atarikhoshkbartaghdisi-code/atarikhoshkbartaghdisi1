    /* Welcome Banner (10s auto-dismiss) */
    .welcome-banner {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 600px;
      margin: 0 auto;
      background: linear-gradient(135deg, #15803d, #047857);
      color: #fff;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: bannerSlideIn 0.5s ease-out;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .welcome-banner.hide {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    @keyframes bannerSlideIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .welcome-banner-content { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 500; }
    .welcome-banner-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .welcome-banner-close:hover { background: rgba(255,255,255,0.35); }

    /* Header */
    header {
      background: linear-gradient(135deg, #14532d 0%, #15803d 50%, #166534 100%);
      color: white;
      padding: 30px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);

    header p.tagline { font-size: 0.95rem; opacity: 0.9; margin-bottom: 14px; }
    .header-badges {

      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;

    /* Search & Filter Bar */

    .search-input {

      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;

    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(21,128,61,0.15); }
    .search-icon {

      right: 14px;
      top: 50%;
      transform: translateY(-50%);

      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);

    .category-btn.active, .category-btn:hover {
