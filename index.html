<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطاری و خشکبار برادران تقدیسی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
    <style>
        :root { --primary: #2c3a24; --accent: #c69234; --bg: #f8f6f0; --text: #22252a; --white: #ffffff; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        header { background: var(--primary); color: var(--white); padding: 20px; text-align: center; }
        .banner { background: var(--accent); color: white; padding: 10px; text-align: center; font-size: 0.9rem; }
        .search-container { padding: 20px; }
        #searchInput { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .price { color: var(--accent); font-weight: bold; margin: 10px 0; }
        .bottom-bar { position: fixed; bottom: 0; width: 100%; display: flex; background: white; border-top: 1px solid #ddd; }
        .bottom-bar a { flex: 1; padding: 15px; text-align: center; text-decoration: none; color: var(--primary); font-weight: bold; }
        .cat-btn { padding: 8px 15px; margin: 5px; border-radius: 20px; border: 1px solid var(--primary); cursor: pointer; background: white; }
        .cat-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="banner">🌿 ارسال رایگان در محدوده نارمک برای سفارش‌های بالای ۴۰۰ هزار تومان</div>
    <header><h1>عطاری و خشکبار برادران تقدیسی</h1><p>کیفیت اعلا • تضمین اصالت کالا</p></header>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="جستجوی محصول (مثلاً پسته، زردچوبه...)" oninput="render()">
        <div id="cats" style="margin-top: 10px;"></div>
    </div>

    <div class="grid" id="productGrid"></div>

    <div class="bottom-bar">
        <a href="tel:09188085331">📞 تماس ۱</a>
        <a href="https://wa.me/989188085331" style="background:#25D366; color:white;">💬 واتساپ ۱</a>
        <a href="tel:09921971423">📞 تماس ۲</a>
    </div>

    <script>
        const products = [
            // نمونه محصولات (اضافه کردن لیست کامل در اینجا)
            {name: "پسته اکبری", price: 493000, cat: "خشکبار و آجیل", img: "https://images.unsplash.com/photo-1599599104027-1834c2361c44?w=400"},
            {name: "زردچوبه اعلا", price: 85000, cat: "ادویه‌جات", img: "https://images.unsplash.com/photo-1596040033229-a9821c05d158?w=400"},
            {name: "عرق زنیان", price: 65000, cat: "عرقیجات و نوشیدنی‌ها", img: "https://images.unsplash.com/photo-1574784267442-70b334164b38?w=400"},
            // ... (بقیه لیست خود را اینجا ادامه دهید)
        ];

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.filter(p => p.name.includes(query)).map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <div class="price">${p.price.toLocaleString()} تومان</div>
                    <button onclick="alert('سفارش شما در واتساپ ارسال شد')">سفارش واتساپی</button>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
