<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطاری و خشکبار برادران تقدیسی | نارمک</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #faf8f5; }
        .bg-olive { background-color: #556b2f; }
        .text-olive { color: #556b2f; }
    </style>
</head>
<body class="bg-[#faf8f5] min-h-screen pb-32">

    <!-- هدر سایت -->
    <header class="bg-[#556b2f] text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center font-bold">ت</div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base">عطاری و خشکبار تقدیسی</h1>
                    <p class="text-[10px] text-amber-200">تهران، نارمک، میدان نبوت</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAdminModal()" class="bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1 transition">
                    <i class="fa-solid fa-lock text-[10px]"></i> مدیریت
                </button>
            </div>
        </div>
    </header>

    <!-- بنر خوش‌آمدگویی غیرمسدودکننده -->
    <div class="max-w-4xl mx-auto px-4 mt-4">
        <div class="bg-gradient-to-r from-[#556b2f] to-[#6b8e23] text-white p-4 sm:p-5 rounded-2xl shadow-md flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <h2 class="font-bold text-base sm:text-lg">🌿 به عطاری و خشکبار برادران تقدیسی خوش آمدید</h2>
                <p class="text-xs text-amber-100 mt-1">ارسال رایگان در محدوده نارمک | محصولات ارگانیک، گیاهان دارویی و خشکبار اعلا</p>
            </div>
            <a href="tel:09188085331" class="bg-white text-[#556b2f] px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-amber-50 transition shrink-0">
                <i class="fa-solid fa-phone ml-1"></i> تماس فوری
            </a>
        </div>
    </div>

    <!-- جستجو و فیلترهای پیشرفته بیماری و سلامت -->
    <div class="max-w-4xl mx-auto px-4 mt-4 space-y-3">
        <div class="relative">
            <input type="text" id="searchInput" oninput="renderProducts()" placeholder="جستجوی گیاه دارویی، ادویه، خشکبار یا مشکل (مثلا خواب، اعصاب، گوارش)..." class="w-full bg-white p-3.5 pr-11 rounded-2xl border border-stone-200 text-sm shadow-sm focus:outline-none focus:border-[#556b2f]">
            <i class="fa-solid fa-search absolute right-4 top-4 text-stone-400"></i>
        </div>

        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="setFilter('all')" class="cat-btn bg-[#556b2f] text-white px-4 py-2 rounded-xl text-xs font-medium shrink-0 transition">همه محصولات</button>
            <button onclick="setFilter('خواب')" class="cat-btn bg-white text-stone-700 border border-stone-200 px-4 py-2 rounded-xl text-xs font-medium shrink-0 transition">🌙 خواب راحت</button>
            <button onclick="setFilter('اعصاب')" class="cat-btn bg-white text-stone-700 border border-stone-200 px-4 py-2 rounded-xl text-xs font-medium shrink-0 transition">🌿 آرامش اعصاب</button>
            <button onclick="setFilter('ایمنی')" class="cat-btn bg-white text-stone-700 border border-stone-200 px-4 py-2 rounded-xl text-xs font-medium shrink-0 transition">🛡️ تقویت ایمنی</button>
            <button onclick="setFilter('گوارش')" class="cat-btn bg-white text-stone-700 border border-stone-200 px-4 py-2 rounded-xl text-xs font-medium shrink-0 transition">🍃 گوارش و معده</button>
            <button onclick="setFilter('خشکبار')" class="cat-btn bg-white text-stone-700 border border-stone-200 px-4 py-2 rounded-xl text-xs font-medium shrink-0 transition">🥜 خشکبار اعلا</button>
        </div>
    </div>

    <!-- لیست محصولات -->
    <main class="max-w-4xl mx-auto px-4 mt-3">
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </main>

    <!-- سبد خرید شناور پایین صفحه -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-stone-200 p-4 shadow-lg z-30 hidden">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div>
                <span class="text-xs text-stone-500">مجموع سبد خرید:</span>
                <div id="cartTotal" class="font-bold text-sm text-[#556b2f]">۰ تومان</div>
            </div>
            <button onclick="checkout()" class="bg-[#556b2f] hover:bg-[#4a5e28] text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow transition">
                تکمیل سفارش (واتساپ / پیامک)
            </button>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div id="adminModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-sm text-stone-800">پنل مدیریت عطاری تقدیسی</h3>
                <button onclick="closeAdminModal()" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- بخش رمز عبور -->
            <div id="loginSection" class="space-y-3">
                <input type="password" id="adminPass" placeholder="رمز عبور مدیریت" class="w-full p-3 border rounded-xl text-sm">
                <button onclick="checkAdminLogin()" class="w-full bg-[#556b2f] text-white py-2.5 rounded-xl text-xs font-bold">ورود به پنل</button>
            </div>

            <!-- بخش مدیریت و افزودن محصول -->
            <div id="manageSection" class="hidden space-y-3">
                <div class="bg-stone-50 p-3 rounded-xl border space-y-2">
                    <h4 class="font-bold text-xs text-[#556b2f]">افزودن محصول جدید</h4>
                    <input type="text" id="newTitle" placeholder="نام محصول" class="w-full p-2.5 bg-white border rounded-xl text-xs">
                    <input type="number" id="newPrice" placeholder="قیمت (تومان)" class="w-full p-2.5 bg-white border rounded-xl text-xs">
                    <input type="text" id="newImage" placeholder="لینک عکس محصول (URL)" class="w-full p-2.5 bg-white border rounded-xl text-xs">
                    <input type="text" id="newCat" placeholder="دسته‌بندی (مثلا: خواب، اعصاب، گوارش، خشکبار)" class="w-full p-2.5 bg-white border rounded-xl text-xs">
                    <button onclick="addNewProduct()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2.5 rounded-xl text-xs font-bold transition">ثبت و افزودن محصول</button>
                </div>
                <div class="pt-2">
                    <h4 class="font-bold text-xs text-stone-700 mb-2">محصولات موجود (قابلیت حذف)</h4>
                    <div id="adminProductList" class="space-y-2 max-h-48 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // داده‌های اولیه محصولات
        let defaultProducts = [
            { id: 1, title: 'گل گاوزبان اعلا', price: 98000, image: '', cat: 'اعصاب' },
            { id: 2, title: 'دمنوش آرامبخش خواب', price: 85000, image: '', cat: 'خواب' },
            { id: 3, title: 'عرق نعناع اصل ارگانیک', price: 45000, image: '', cat: 'گوارش' },
            { id: 4, title: 'معجون تقویت سیستم ایمنی', price: 125000, image: '', cat: 'ایمنی' },
            { id: 5, title: 'مغز بادام درختی اعلا', price: 420000, image: '', cat: 'خشکبار' }
        ];

        let products = JSON.parse(localStorage.getItem('taghdisi_products')) || defaultProducts;
        let cart = {};
        let currentFilter = 'all';

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            let filtered = products.filter(p => {
                let matchCat = (currentFilter === 'all' || p.cat === currentFilter);
                let matchSearch = p.title.toLowerCase().includes(search) || (p.cat && p.cat.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-stone-400 text-xs">محصولی یافت نشد.</div>`;
                return;
            }

            filtered.forEach(p => {
                let qty = cart[p.id] || 0;
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-stone-200 flex flex-col justify-between">
                        <div>
                            <img src="${p.image || 'https://via.placeholder.com/200?text=Taghdisi'}" class="w-full h-28 object-cover rounded-xl mb-2 bg-stone-100" onerror="this.src='https://via.placeholder.com/200?text=Taghdisi'">
                            <span class="text-[10px] bg-amber-50 text-amber-800 px-2 py-0.5 rounded-md font-medium">${p.cat || 'عطاری'}</span>
                            <h4 class="font-bold text-xs text-stone-800 mt-1.5 line-clamp-1">${p.title}</h4>
                        </div>
                        <div class="mt-3">
                            <div class="text-[#556b2f] font-bold text-xs mb-2">${p.price.toLocaleString()} تومان</div>
                            ${qty === 0 ? `
                                <button onclick="updateCart(${p.id}, 1)" class="w-full bg-[#556b2f]/10 hover:bg-[#556b2f] hover:text-white text-[#556b2f] py-1.5 rounded-xl text-xs font-bold transition">افزودن به سبد</button>
                            ` : `
                                <div class="flex items-center justify-between bg-stone-100 rounded-xl p-1">
                                    <button onclick="updateCart(${p.id}, -1)" class="w-7 h-7 bg-white rounded-lg shadow-sm text-xs font-bold">-</button>
                                    <span class="text-xs font-bold">${qty}</span>
                                    <button onclick="updateCart(${p.id}, 1)" class="w-7 h-7 bg-[#556b2f] text-white rounded-lg shadow-sm text-xs font-bold">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-[#556b2f]', 'text-white');
                btn.classList.add('bg-white', 'text-stone-700');
            });
            event.target.classList.remove('bg-white', 'text-stone-700');
            event.target.classList.add('bg-[#556b2f]', 'text-white');
            renderProducts();
        }

        function updateCart(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] <= 0) delete cart[id];
            
            let totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            let totalPrice = 0;
            for (let id in cart) {
                let p = products.find(x => x.id == id);
                if (p) totalPrice += p.price * cart[id];
            }

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cartTotal').innerText = totalPrice.toLocaleString() + ' تومان';
            } else {
                cartBar.classList.add('hidden');
            }
            renderProducts();
        }

        function checkout() {
            let text = "سلام، سفارش خود از عطاری برادران تقدیسی:\n\n";
            let totalPrice = 0;
            for (let id in cart) {
                let p = products.find(x => x.id == id);
                if (p) {
                    text += `- ${p.title} (${cart[id]} عدد): ${(p.price * cart[id]).toLocaleString()} تومان\n`;
                    totalPrice += p.price * cart[id];
                }
            }
            text += `\nمجموع قابل پرداخت: ${totalPrice.toLocaleString()} تومان\nارسال به نارمک`;
            window.open(`https://wa.me/989188085331?text=${encodeURIComponent(text)}`, '_blank');
        }

        // پنل مدیریت
        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

        function checkAdminLogin() {
            let pass = document.getElementById('adminPass').value;
            if (pass === 'GAPGPTMASKTOKENs2f5qegxdvpX0X' || pass === 'Mjt_3330') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('manageSection').classList.remove('hidden');
                renderAdminList();
            } else {
                alert('رمز عبور اشتباه است!');
            }
        }

        function addNewProduct() {
            let title = document.getElementById('newTitle').value;
            let price = parseInt(document.getElementById('newPrice').value);
            let image = document.getElementById('newImage').value;
            let cat = document.getElementById('newCat').value || 'عمومی';

            if (!title || !price) {
                alert('لطفا نام و قیمت را وارد کنید.');
                return;
            }

            products.unshift({ id: Date.now(), title, price, image, cat });
            localStorage.setItem('taghdisi_products', JSON.stringify(products));
            
            document.getElementById('newTitle').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImage').value = '';
            document.getElementById('newCat').value = '';

            renderProducts();
            renderAdminList();
            alert('محصول با موفقیت اضافه شد!');
        }

        function deleteProduct(id) {
            if (confirm('آیا از حذف این محصول اطمینان دارید؟')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('taghdisi_products', JSON.stringify(products));
                renderProducts();
                renderAdminList();
            }
        }

        function renderAdminList() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 rounded-xl border text-xs">
                        <span class="font-medium truncate max-w-[180px]">${p.title} - ${p.price.toLocaleString()} تومان</span>
                        <button onclick="deleteProduct(${p.id})" class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded-lg font-bold">حذف</button>
                    </div>
                `;
            });
        }

        renderProducts();
    </script>
</body>
</html>
